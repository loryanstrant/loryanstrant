name: Update Home Assistant Projects Page

on:
  schedule:
    # Every Monday at 07:00 UTC (one hour after the profile-assets workflow)
    - cron: "0 7 * * 1"
  push:
    branches:
      - main
    paths:
      - "scripts/generate_ha_page.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Generate Home Assistant projects page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_ha_page.py

      - name: Commit updated page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add home-assistant.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh Home Assistant projects page [skip ci]"
            git push
          fi
